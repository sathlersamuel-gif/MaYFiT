<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/src/figures.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/mobile-audit.css" />
    <title>MaYFiT</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#050706}
      #boot-status{position:fixed;inset:0;display:grid;place-items:center;background:#050706;color:#fff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;text-align:center;padding:24px}
      #boot-status strong{display:block;color:#8df20b;font-size:30px;margin-bottom:10px}
      #boot-status small{color:#b9c8be}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-status"><div><strong>MaYFiT</strong><small>Carregando aplicativo…</small></div></div>
    <script>
      window.addEventListener('error',function(event){
        var root=document.getElementById('root');
        var boot=document.getElementById('boot-status');
        if(root&&!root.childElementCount&&boot){
          boot.querySelector('small').textContent='Erro ao carregar: '+(event.message||'atualize a página');
        }
      });
      window.addEventListener('unhandledrejection',function(event){
        var root=document.getElementById('root');
        var boot=document.getElementById('boot-status');
        if(root&&!root.childElementCount&&boot){
          boot.querySelector('small').textContent='Erro ao iniciar o aplicativo.';
        }
      });
      new MutationObserver(function(_,observer){
        var root=document.getElementById('root');
        var boot=document.getElementById('boot-status');
        if(root&&root.childElementCount&&boot){observer.disconnect();boot.remove();}
      }).observe(document.getElementById('root'),{childList:true});
    </script>
    <script src="/src/legacy-workout-recovery.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/src/approved-workout-ui.js"></script>
    <script src="/src/workout-interactions.js"></script>
    <script type="module" src="/src/firebase-auth-bridge.js"></script>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',async function(){
          try{
            var registrations=await navigator.serviceWorker.getRegistrations();
            for(var registration of registrations)await registration.unregister();
            var keys=await caches.keys();
            await Promise.all(keys.map(function(key){return caches.delete(key)}));
          }catch(error){}
        });
      }
    </script>
  </body>
</html>
