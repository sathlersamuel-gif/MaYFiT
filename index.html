<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/figures.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <title>MaYFiT</title>
    <style>
      #mayfit-role-switch{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:9999;border:0;border-radius:999px;padding:12px 16px;background:#7ed832;color:#07120d;font:800 14px system-ui,-apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)}
      #mayfit-pause-control{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 92px);margin:0 0 14px 92px;padding:10px 14px;border:1px solid #41634d;border-radius:16px;background:#101a14;color:#fff;box-sizing:border-box}
      #mayfit-pause-control strong{font:900 13px system-ui,-apple-system,sans-serif;white-space:nowrap}
      #mayfit-pause-control .pause-stepper{display:flex;align-items:center;gap:8px}
      #mayfit-pause-control button{width:38px;height:38px;border:1px solid #3f6749;border-radius:12px;background:#17341f;color:#86e044;font:950 22px system-ui,-apple-system,sans-serif}
      #mayfit-pause-control input{width:82px;height:38px;border:1px solid #8b9b90;border-radius:12px;background:#f7faf8;color:#d9262e;text-align:center;font:950 20px system-ui,-apple-system,sans-serif;box-sizing:border-box}
      #mayfit-pause-control small{color:#b9c8be;font:750 11px system-ui,-apple-system,sans-serif;white-space:nowrap}
      body.theme-light #mayfit-pause-control{background:#fff;color:#15231a;border-color:#c7d5cb}
      #exercise-picker-overlay{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:12px}
      .exercise-picker-card{width:min(760px,100%);height:min(90vh,840px);display:grid;grid-template-rows:auto auto 1fr auto;background:#101a14;color:#fff;border:1px solid #3b5b46;border-radius:22px;overflow:hidden}
      .exercise-picker-head,.exercise-picker-tools,.exercise-picker-footer{display:flex;align-items:center;gap:10px;padding:14px}
      .exercise-picker-head{justify-content:space-between;border-bottom:1px solid #30463a}
      .exercise-picker-head h2{margin:0}.exercise-picker-head p{margin:3px 0 0;color:#aebcb3;font-size:12px}
      .picker-close{width:40px;height:40px;border:0;border-radius:12px;background:#24392b;color:#fff;font-size:26px}
      .exercise-picker-tools{flex-wrap:wrap;border-bottom:1px solid #30463a}
      .picker-search{display:flex;align-items:center;gap:8px;flex:1 1 240px;background:#09110c;border:1px solid #466451;border-radius:12px;padding:0 10px}
      .picker-search input{width:100%;height:42px;border:0;background:transparent;color:#fff;outline:0}
      .exercise-picker-tools button{border:0;border-radius:11px;padding:11px 12px;background:#213729;color:#fff;font-weight:850}
      #exercise-picker-list{overflow:auto;padding:12px;display:grid;gap:8px}
      .exercise-choice{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #385341;border-radius:13px;background:#142219}
      .exercise-choice.assigned{border-color:#8d4545;background:#271818}
      .exercise-choice input{width:20px;height:20px;accent-color:#7ed832}
      .exercise-choice span{display:block}.exercise-choice small{display:block;margin-top:2px;font-size:11px;opacity:.75}
      .exercise-picker-footer{position:sticky;bottom:0;flex-wrap:wrap;border-top:1px solid #30463a;background:#0c1510;padding-bottom:max(14px,env(safe-area-inset-bottom))}
      #selected-count{margin-right:auto}
      #remove-selected,#remove-all-assigned,#assign-selected{border:0;border-radius:12px;padding:11px 13px;color:#fff;font:850 13px system-ui,-apple-system,sans-serif}
      #remove-selected{background:#8f2424}#remove-all-assigned{background:#4f1717}#assign-selected{background:#7ed832;color:#07120d}
      .workout-screen .sheet-row.mayfit-selected{box-shadow:inset 0 0 0 2px #8df20b,inset 0 0 24px rgba(141,242,11,.16)!important}
      .workout-screen .complete-button.mayfit-selected{background:#8df20b!important;border-color:#caff63!important;box-shadow:0 0 18px rgba(141,242,11,.75)!important}
      .workout-screen .complete-button.mayfit-selected::after{content:'✓';display:grid;place-items:center;width:100%;height:100%;color:#071108;font-size:25px;font-weight:1000}
      .workout-screen .timer-control.running{animation:mayfitPulse 1s infinite alternate;box-shadow:0 0 24px rgba(84,255,17,.9)!important}
      .workout-screen .timer-control.mayfit-attention{background:#e0a400!important;color:#101000!important}
      @keyframes mayfitPulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
      @media(max-width:620px){#mayfit-pause-control{width:calc(100% - 50px);margin-left:50px;gap:8px;padding:8px 10px}#mayfit-pause-control strong{font-size:11px}#mayfit-pause-control input{width:66px;height:36px;font-size:18px}#mayfit-pause-control button{width:34px;height:36px}#exercise-picker-overlay{padding:0}.exercise-picker-card{width:100%;height:100%;max-height:none;border-radius:0}.exercise-picker-footer button{flex:1 1 calc(50% - 6px)}#selected-count{flex:1 1 100%;margin:0}}
    </style>
    <script>(function(){const t=localStorage.getItem('mayfit_theme')||'dark';if(t==='light')document.documentElement.classList.add('pre-theme-light')})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/src/workout-interactions.js"></script>
    <script>
      if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'))}
      const STORE='mayfit_v8';
      const DB='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json';
      let exerciseCatalog=[];
      function readData(){try{return JSON.parse(localStorage.getItem(STORE))}catch{return null}}
      function writeData(data){localStorage.setItem(STORE,JSON.stringify(data))}
      function applyTheme(theme){const light=theme==='light';document.body.classList.toggle('theme-light',light);document.documentElement.classList.remove('pre-theme-light');localStorage.setItem('mayfit_theme',light?'light':'dark');const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=light?'#edf4ef':'#06100b';const b=document.getElementById('mayfit-theme-toggle');if(b)b.innerHTML=light?'<span>🌙</span><b>Escuro</b>':'<span>☀️</span><b>Claro</b>'}
      function installThemeToggle(){const header=document.querySelector('.app > header');if(!header)return;let actions=header.querySelector('.mayfit-header-actions');if(!actions){actions=document.createElement('div');actions.className='mayfit-header-actions';const bell=header.querySelector(':scope > .icon');if(bell){header.insertBefore(actions,bell);actions.appendChild(bell)}else header.appendChild(actions)}let b=document.getElementById('mayfit-theme-toggle');if(!b){b=document.createElement('button');b.id='mayfit-theme-toggle';b.type='button';b.onclick=()=>applyTheme(document.body.classList.contains('theme-light')?'dark':'light')}if(b.parentElement!==actions)actions.insertBefore(b,actions.firstChild);applyTheme(localStorage.getItem('mayfit_theme')||'dark')}
      function installRoleSwitch(){let current=null;try{current=JSON.parse(sessionStorage.getItem('mayfit_user'))}catch{}if(!current)return;let b=document.getElementById('mayfit-role-switch');if(b)b.remove();b=document.createElement('button');b.id='mayfit-role-switch';b.type='button';if(current.role==='admin'){b.textContent='Ver como aluno';b.onclick=()=>{sessionStorage.setItem('mayfit_user',JSON.stringify({id:'aluno',name:'Aluno Teste',email:'aluno@mayfit.com',password:'123456',role:'student'}));location.reload()}}else{b.textContent='Voltar ao gerenciamento';b.onclick=()=>{sessionStorage.setItem('mayfit_user',JSON.stringify({id:'admin',name:'Samuel',email:'admin@mayfit.com',password:'123456',role:'admin'}));location.reload()}}document.body.appendChild(b)}
      function setReactInputValue(input,value){const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;if(setter)setter.call(input,String(value));else input.value=String(value);input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))}
      function installPauseControl(){const top=document.querySelector('.workout-top');if(!top)return;if(!document.getElementById('mayfit-pause-control')){const pause=document.createElement('div');pause.id='mayfit-pause-control';const saved=Math.max(0,Number(localStorage.getItem('mayfit_pause_seconds'))||60);pause.innerHTML=`<strong>TEMPO DE PAUSA</strong><div class="pause-stepper"><button type="button" data-step="-5">−</button><input type="number" min="0" step="5" value="${saved}"><button type="button" data-step="5">+</button></div><small>segundos</small>`;top.insertAdjacentElement('afterend',pause);const input=pause.querySelector('input');const save=()=>{const v=Math.max(0,Number(input.value)||0);input.value=v;localStorage.setItem('mayfit_pause_seconds',String(v))};input.onchange=save;input.onblur=save;pause.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{input.value=Math.max(0,(Number(input.value)||0)+Number(btn.dataset.step));save()})}}
      function closePicker(){document.getElementById('exercise-picker-overlay')?.remove()}
      function addSelected(ids){if(!ids.length)return alert('Selecione pelo menos um exercício.');const data=readData();if(!data||!Array.isArray(data.exercises))return alert('Não foi possível acessar o treino atual.');const used=new Set(data.exercises.map(e=>e.type));let next=Math.max(0,...data.exercises.map(e=>Number(e.id)||0))+1;let added=0;ids.forEach(type=>{if(used.has(type))return;const item=exerciseCatalog.find(x=>x.id===type);if(!item)return;data.exercises.push({id:next++,type:item.id,name:item.name,sets:3,reps:12,load:0,previousLoad:0,rest:60,tip:'Descreva a execução correta.'});used.add(type);added++});writeData(data);closePicker();alert(`${added} exercício(s) atribuído(s).`);location.reload()}
      function removeSelected(ids){if(!ids.length)return alert('Selecione os exercícios atribuídos que deseja excluir.');const data=readData();if(!data||!Array.isArray(data.exercises))return alert('Não foi possível acessar o treino atual.');const removing=new Set(ids);const before=data.exercises.length;data.exercises=data.exercises.filter(e=>!removing.has(e.type));const removed=before-data.exercises.length;if(!removed)return alert('Nenhum dos exercícios selecionados está atribuído ao aluno.');if(!confirm(`Excluir ${removed} exercício(s) da área do aluno?`))return;writeData(data);closePicker();alert(`${removed} exercício(s) excluído(s).`);location.reload()}
      function removeAllAssigned(){const data=readData();if(!data?.exercises?.length)return alert('O aluno não possui exercícios atribuídos.');if(!confirm(`Excluir todos os ${data.exercises.length} exercícios da área do aluno?`))return;data.exercises=[];writeData(data);closePicker();alert('Todos os exercícios foram excluídos.');location.reload()}
      function openPicker(){if(document.getElementById('exercise-picker-overlay'))return;const overlay=document.createElement('div');overlay.id='exercise-picker-overlay';overlay.innerHTML='<div class="exercise-picker-card"><div class="exercise-picker-head"><div><h2>Selecionar exercícios</h2><p>Selecione para atribuir ou excluir da área do aluno.</p></div><button class="picker-close">×</button></div><div class="exercise-picker-tools"><label class="picker-search"><span>🔎</span><input id="exercise-picker-search" placeholder="Buscar exercício"></label><button id="select-all">Selecionar todos</button><button id="select-assigned">Selecionar atribuídos</button><button id="clear-selection">Limpar</button></div><div id="exercise-picker-list"><p>Carregando exercícios...</p></div><div class="exercise-picker-footer"><strong id="selected-count">0 selecionados</strong><button id="remove-selected">Excluir selecionados</button><button id="remove-all-assigned">Excluir todos do aluno</button><button id="assign-selected">Atribuir selecionados</button></div></div>';document.body.appendChild(overlay);overlay.querySelector('.picker-close').onclick=closePicker;overlay.onclick=e=>{if(e.target===overlay)closePicker()};const count=()=>{overlay.querySelector('#selected-count').textContent=`${overlay.querySelectorAll('.exercise-choice input:checked').length} selecionados`};const selected=()=>[...overlay.querySelectorAll('.exercise-choice input:checked')].map(i=>i.value);const render=(q='')=>{const data=readData();const assigned=new Set(data?.exercises?.map(e=>e.type)||[]);const filtered=exerciseCatalog.filter(x=>x.name.toLowerCase().includes(q.toLowerCase().trim()));overlay.querySelector('#exercise-picker-list').innerHTML=filtered.map(x=>`<label class="exercise-choice ${assigned.has(x.id)?'assigned':''}"><input type="checkbox" value="${x.id}" data-assigned="${assigned.has(x.id)?'1':'0'}"><span>${x.name}<small>${assigned.has(x.id)?'Já atribuído ao aluno':'Disponível para atribuir'}</small></span></label>`).join('')||'<p>Nenhum exercício encontrado.</p>';overlay.querySelectorAll('.exercise-choice input').forEach(i=>i.onchange=count);count()};overlay.querySelector('#exercise-picker-search').oninput=e=>render(e.target.value);overlay.querySelector('#select-all').onclick=()=>{overlay.querySelectorAll('.exercise-choice input').forEach(i=>i.checked=true);count()};overlay.querySelector('#select-assigned').onclick=()=>{overlay.querySelectorAll('.exercise-choice input').forEach(i=>i.checked=i.dataset.assigned==='1');count()};overlay.querySelector('#clear-selection').onclick=()=>{overlay.querySelectorAll('.exercise-choice input').forEach(i=>i.checked=false);count()};overlay.querySelector('#assign-selected').onclick=()=>addSelected(selected());overlay.querySelector('#remove-selected').onclick=()=>removeSelected(selected());overlay.querySelector('#remove-all-assigned').onclick=removeAllAssigned;const loadCatalog=()=>fetch(DB).then(r=>r.json()).then(items=>{exerciseCatalog=items.map(x=>({id:x.id,name:x.name})).filter(x=>x.id&&x.name).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));render()}).catch(()=>overlay.querySelector('#exercise-picker-list').innerHTML='<p>Não foi possível carregar os exercícios.</p>');exerciseCatalog.length?render():loadCatalog()}
      function installPickerButton(){let current=null;try{current=JSON.parse(sessionStorage.getItem('mayfit_user'))}catch{}if(current?.role!=='admin')return;document.querySelectorAll('.section-title .small').forEach(btn=>{if(btn.dataset.pickerReady)return;if(/novo|mais|exerc/i.test(btn.textContent)){btn.dataset.pickerReady='1';btn.onclick=e=>{e.preventDefault();e.stopPropagation();openPicker()}}})}
      applyTheme(localStorage.getItem('mayfit_theme')||'dark');
      window.addEventListener('load',()=>{installThemeToggle();installRoleSwitch();installPickerButton();installPauseControl();setInterval(()=>{installThemeToggle();installPickerButton();installPauseControl()},700)});
    </script>
  </body>
</html>
