<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/figures.css" />
    <link rel="stylesheet" href="./src/theme.css" />
    <link rel="stylesheet" href="./src/mobile-audit.css" />
    <title>MaYFiT</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#050706}
      #boot-status{position:fixed;inset:0;display:grid;place-items:center;background:#050706;color:#fff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;text-align:center;padding:24px}
      #boot-status strong{display:block;color:#8df20b;font-size:30px;margin-bottom:10px}
      #boot-status small{color:#b9c8be}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-status"><div><strong>MaYFiT</strong><small>Carregando aplicativo…</small></div></div>

    <script>
      window.addEventListener('error', function(event){
        var box=document.getElementById('boot-status');
        if(box) box.innerHTML='<div><strong>MaYFiT</strong><p>Erro ao carregar o aplicativo.</p><small>'+String(event.message||'Erro desconhecido')+'</small></div>';
      });
      window.addEventListener('unhandledrejection', function(event){
        var box=document.getElementById('boot-status');
        var reason=event.reason&&event.reason.message?event.reason.message:event.reason;
        if(box) box.innerHTML='<div><strong>MaYFiT</strong><p>Erro ao iniciar o aplicativo.</p><small>'+String(reason||'Erro desconhecido')+'</small></div>';
      });
      setTimeout(function(){
        var root=document.getElementById('root');
        var box=document.getElementById('boot-status');
        if(root&&root.childElementCount>0&&box) box.remove();
        else if(box) box.innerHTML='<div><strong>MaYFiT</strong><p>A publicação ainda não carregou corretamente.</p><small>Abra o GitHub em Settings → Pages e selecione GitHub Actions em Source.</small></div>';
      },8000);
    </script>

    <script type="module" src="./src/app-bootstrap.js"></script>
    <script type="module" src="./src/supabase-auth-bridge.js"></script>
    <script type="module" src="./src/student-management.js"></script>
    <script type="module" src="./src/workout-interactions.js"></script>
    <script type="module" src="./src/workout-history.js"></script>
    <script type="module" src="./src/history-persistence-fix.js"></script>
    <script type="module" src="./src/admin-history-initial-load-fix.js"></script>
    <script type="module" src="./src/exercise-translation-admin-return.js"></script>
    <script type="module" src="./src/exercise-selector-single-thumbnail.js"></script>
  </body>
</html>
