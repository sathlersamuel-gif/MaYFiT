<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/figures.css?v=14" />
    <link rel="stylesheet" href="/src/theme.css?v=14" />
    <link rel="stylesheet" href="/src/mobile-audit.css?v=1" />
    <title>MaYFiT</title>
    <style>
      html,body,#root{min-height:100%;background:#050706}
      #mayfit-pause-control{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 92px);margin:0 0 14px 92px;padding:10px 14px;border:1px solid #41634d;border-radius:16px;background:#101a14;color:#fff;box-sizing:border-box}
      #mayfit-pause-control strong{font:900 13px system-ui,-apple-system,sans-serif;white-space:nowrap}
      #mayfit-pause-control .pause-stepper{display:flex;align-items:center;gap:8px}
      #mayfit-pause-control button{width:38px;height:38px;border:1px solid #3f6749;border-radius:12px;background:#17341f;color:#86e044;font:950 22px system-ui,-apple-system,sans-serif}
      #mayfit-pause-control input{width:82px;height:38px;border:1px solid #8b9b90;border-radius:12px;background:#f7faf8;color:#d9262e;text-align:center;font:950 20px system-ui,-apple-system,sans-serif;box-sizing:border-box}
      #mayfit-pause-control small{color:#b9c8be;font:750 11px system-ui,-apple-system,sans-serif;white-space:nowrap}
      #mayfit-pause-control.counting{border-color:#9df20f!important;box-shadow:0 0 18px rgba(141,242,11,.35)!important}
      #mayfit-pause-control.counting input{color:#9df20f!important;background:#071108!important}
      .workout-screen .sheet-row.mayfit-selected{box-shadow:inset 0 0 0 2px #8df20b,inset 0 0 24px rgba(141,242,11,.16)!important}
      .workout-screen .complete-button.mayfit-selected{background:#8df20b!important;border-color:#caff63!important;box-shadow:0 0 18px rgba(141,242,11,.75)!important}
      .workout-screen .complete-button.mayfit-selected::after{content:'✓';display:grid;place-items:center;width:100%;height:100%;color:#071108;font-size:25px;font-weight:1000}
      .workout-screen .timer-control.running{animation:mayfitPulse 1s infinite alternate;box-shadow:0 0 24px rgba(84,255,17,.9)!important}
      .workout-screen .timer-control.mayfit-paused{background:#54e600!important;border-color:#9dff45!important;color:#fff!important;box-shadow:0 0 20px rgba(84,230,0,.7)!important}
      .workout-screen .timer-control.mayfit-attention{background:#e0a400!important;color:#101000!important}
      @keyframes mayfitPulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
      @media(max-width:620px){
        .workout-screen{padding-top:max(12px,env(safe-area-inset-top))!important}
        .workout-screen .workout-top{position:relative!important;top:auto!important;grid-template-columns:42px minmax(0,1fr)!important;gap:5px!important;padding-top:0!important}
        .workout-screen .back-button{width:42px!important;height:56px!important}
        .workout-screen .time-strip{height:56px!important;grid-template-columns:auto minmax(0,1fr) 116px!important;padding:5px 6px!important;gap:4px!important;overflow:hidden!important}
        .workout-screen .time-strip span{font-size:12px!important}
        .workout-screen .time-strip input{font-size:30px!important;min-width:0!important}
        .workout-screen .timer-control{display:flex!important;align-items:center!important;justify-content:center!important;height:44px!important;width:100%!important;min-width:0!important;max-width:116px!important;padding:0 4px!important;margin:0!important;font:900 10px/1 system-ui,-apple-system,sans-serif!important;letter-spacing:-.25px!important;text-indent:0!important;box-sizing:border-box!important;white-space:nowrap!important;overflow:hidden!important;text-align:center!important}
        #mayfit-pause-control{position:relative!important;top:auto!important;width:100%!important;margin:0 0 12px!important;min-height:56px!important;gap:6px!important;padding:6px 7px!important;border-radius:0 0 30px 30px!important}
        #mayfit-pause-control strong{font-size:10px!important}
        #mayfit-pause-control input{width:58px!important;height:34px!important;font-size:22px!important}
        #mayfit-pause-control button{width:32px!important;height:32px!important;flex-basis:32px!important;font-size:20px!important}
        #mayfit-pause-control small{font-size:9px!important}
        .workout-screen .sheet-row{min-height:0!important}
        .workout-screen .exercise-col{justify-content:flex-start!important;padding:8px 6px 12px!important}
        .workout-screen .exercise-col>strong{font-size:15px!important;line-height:1.08!important;margin:0 0 10px!important}
        .workout-screen .exercise-photo{display:block!important;width:100%!important;height:auto!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important;background:transparent!important;overflow:visible!important}
        .workout-screen .exercise-photo .pose-pair{width:100%!important;height:auto!important;aspect-ratio:1.52/1!important;border:1px solid #344239!important;border-radius:10px!important;overflow:hidden!important;background:#050706!important}
        .workout-screen .exercise-photo>span{position:static!important;display:flex!important;align-items:center!important;gap:6px!important;width:100%!important;max-width:none!important;margin:8px 0 0!important;padding:0!important;border:0!important;background:transparent!important;color:#fff!important;font-size:9px!important;font-weight:950!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important;line-height:1.2!important}
        .workout-screen .exercise-photo>span::before{content:'✓';display:grid;place-items:center;width:18px;height:18px;flex:0 0 18px;border:2px solid #8df20b;border-radius:50%;color:#8df20b;font-size:12px;font-weight:1000;line-height:1}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx?v=16"></script>
    <script type="module" src="/src/supabase-auth-bridge.js?v=4"></script>
    <script type="module" src="/src/student-management.js?v=5"></script>
    <script type="module" src="/src/workout-interactions.js?v=16"></script>
    <script type="module" src="/src/workout-history.js?v=3"></script>
    <script>
      if('serviceWorker' in navigator){window.addEventListener('load',async()=>{const registration=await navigator.serviceWorker.register('/sw.js?v=34');registration.update()})}
      function applyTheme(theme){const light=theme==='light';document.body.classList.toggle('theme-light',light);localStorage.setItem('mayfit_theme',light?'light':'dark');const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=light?'#edf4ef':'#06100b'}
      function installPauseControl(){const top=document.querySelector('.workout-top');if(!top)return;if(document.getElementById('mayfit-pause-control'))return;const pause=document.createElement('div');pause.id='mayfit-pause-control';const saved=Math.max(0,Number(localStorage.getItem('mayfit_pause_seconds'))||60);pause.innerHTML=`<strong>TEMPO DE PAUSA</strong><div class="pause-stepper"><button type="button" data-step="-5">−</button><input type="number" min="0" step="5" value="${saved}"><button type="button" data-step="5">+</button></div><small>segundos</small>`;top.insertAdjacentElement('afterend',pause);const input=pause.querySelector('input');const save=()=>{if(pause.classList.contains('counting'))return;const v=Math.max(0,Number(input.value)||0);input.value=v;localStorage.setItem('mayfit_pause_seconds',String(v))};input.onchange=save;input.onblur=save;pause.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{if(pause.classList.contains('counting'))return;input.value=Math.max(0,(Number(input.value)||0)+Number(btn.dataset.step));save()})}
      function parseClock(value){const parts=String(value||'0').split(':').map(Number);return parts.length>1?Math.max(0,(parts[0]||0)*60+(parts[1]||0)):Math.max(0,parts[0]||0)}
      let lastExerciseClock='00:00';
      function separatePauseCountdown(){const screen=document.querySelector('.workout-screen');const pause=document.getElementById('mayfit-pause-control');if(!screen||!pause)return;const phase=screen.querySelector('.time-strip span');const mainInput=screen.querySelector('.time-strip input');const pauseInput=pause.querySelector('input');const timerButton=screen.querySelector('.timer-control');if(timerButton)timerButton.classList.toggle('mayfit-paused',timerButton.textContent.trim().toUpperCase()==='CONTINUAR');if(!phase||!mainInput||!pauseInput)return;const isPause=phase.textContent.trim().toUpperCase()==='PAUSA';if(!isPause){lastExerciseClock=mainInput.value||lastExerciseClock;pause.classList.remove('counting');pauseInput.readOnly=false;pause.querySelectorAll('button').forEach(button=>button.disabled=false);const configured=String(Math.max(0,Number(localStorage.getItem('mayfit_pause_seconds'))||60));if(document.activeElement!==pauseInput&&pauseInput.value!==configured)pauseInput.value=configured;return}const remaining=parseClock(mainInput.value);pause.classList.add('counting');pauseInput.readOnly=true;pause.querySelectorAll('button').forEach(button=>button.disabled=true);pauseInput.value=String(remaining);if(lastExerciseClock)mainInput.value=lastExerciseClock}
      function preserveAdminSession(event){const button=event.target.closest('button');if(!button||button.textContent.trim()!=='Ver aluno')return;try{const current=JSON.parse(sessionStorage.getItem('mayfit_user'));if(current?.role==='admin')sessionStorage.setItem('mayfit_admin_return',JSON.stringify(current))}catch{}}
      function installAdminReturnButton(){const stored=sessionStorage.getItem('mayfit_admin_return');const nav=document.querySelector('.app>nav');if(!stored||!nav)return;const current=(()=>{try{return JSON.parse(sessionStorage.getItem('mayfit_user'))}catch{return null}})();if(current?.role==='admin'||nav.querySelector('[data-admin-return]'))return;const button=document.createElement('button');button.type='button';button.dataset.adminReturn='true';button.innerHTML='<span style="font-size:20px">↩</span><span>Gerenciador</span>';button.onclick=()=>{try{const admin=JSON.parse(sessionStorage.getItem('mayfit_admin_return'));if(!admin||admin.role!=='admin')return;button.disabled=true;sessionStorage.setItem('mayfit_user',JSON.stringify(admin));sessionStorage.removeItem('mayfit_admin_return');location.reload()}catch{}};nav.insertBefore(button,nav.firstChild)}
      function optimizeImages(root=document){root.querySelectorAll('img:not([data-mayfit-optimized])').forEach(img=>{img.dataset.mayfitOptimized='1';img.loading='lazy';img.decoding='async'})}
      function refreshDynamicUi(){if(document.hidden)return;installPauseControl();installAdminReturnButton();optimizeImages();if(document.querySelector('.workout-screen'))separatePauseCountdown()}
      document.addEventListener('click',preserveAdminSession,true);
      applyTheme(localStorage.getItem('mayfit_theme')||'dark');
      window.addEventListener('load',()=>{refreshDynamicUi();const observer=new MutationObserver(mutations=>{for(const mutation of mutations){if(mutation.addedNodes.length){requestAnimationFrame(refreshDynamicUi);break}}});observer.observe(document.getElementById('root'),{childList:true,subtree:true});setInterval(refreshDynamicUi,1000)})
    </script>
  </body>
</html>
