<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MaYFiT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx?v=16"></script>
    <script type="module" src="/src/supabase-auth-bridge.js?v=4"></script>
    <script type="module" src="/src/student-management.js?v=6"></script>
    <script type="module" src="/src/workout-interactions.js?v=16"></script>
    <script type="module" src="/src/workout-history.js?v=6"></script>
    <script>
      if('serviceWorker' in navigator){window.addEventListener('load',async()=>{const registration=await navigator.serviceWorker.register('/sw.js?v=37');registration.update()})}
      function applyTheme(theme){const light=theme==='light';document.body.classList.toggle('theme-light',light);localStorage.setItem('mayfit_theme',light?'light':'dark');const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=light?'#edf4ef':'#06100b'}
      function installPauseControl(){const top=document.querySelector('.workout-top');if(!top)return;if(document.getElementById('mayfit-pause-control'))return;const pause=document.createElement('div');pause.id='mayfit-pause-control';const saved=Math.max(0,Number(localStorage.getItem('mayfit_pause_seconds'))||60);pause.innerHTML=`<strong>TEMPO DE PAUSA</strong><div class="pause-stepper"><button type="button" data-step="-5">−</button><input type="number" min="0" step="5" value="${saved}"><button type="button" data-step="5">+</button></div><small>segundos</small>`;top.insertAdjacentElement('afterend',pause);const input=pause.querySelector('input');const save=()=>{if(pause.classList.contains('counting'))return;const v=Math.max(0,Number(input.value)||0);input.value=v;localStorage.setItem('mayfit_pause_seconds',String(v))};input.onchange=save;input.onblur=save;pause.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{if(pause.classList.contains('counting'))return;input.value=Math.max(0,(Number(input.value)||0)+Number(btn.dataset.step));save()})}
      function parseClock(value){const parts=String(value||'0').split(':').map(Number);return parts.length>1?Math.max(0,(parts[0]||0)*60+(parts[1]||0)):Math.max(0,parts[0]||0)}
      let lastExerciseClock='00:00';
      function separatePauseCountdown(){const screen=document.querySelector('.workout-screen');const pause=document.getElementById('mayfit-pause-control');if(!screen||!pause)return;const phase=screen.querySelector('.time-strip span');const mainInput=screen.querySelector('.time-strip input');const pauseInput=pause.querySelector('input');const timerButton=screen.querySelector('.timer-control');if(timerButton)timerButton.classList.toggle('mayfit-paused',timerButton.textContent.trim().toUpperCase()==='CONTINUAR');if(!phase||!mainInput||!pauseInput)return;const isPause=phase.textContent.trim().toUpperCase()==='PAUSA';if(!isPause){lastExerciseClock=mainInput.value||lastExerciseClock;pause.classList.remove('counting');pauseInput.readOnly=false;pause.querySelectorAll('button').forEach(button=>button.disabled=false);const configured=String(Math.max(0,Number(localStorage.getItem('mayfit_pause_seconds'))||60));if(document.activeElement!==pauseInput&&pauseInput.value!==configured)pauseInput.value=configured;return}const remaining=parseClock(mainInput.value);pause.classList.add('counting');pauseInput.readOnly=true;pause.querySelectorAll('button').forEach(button=>button.disabled=true);pauseInput.value=String(remaining);if(lastExerciseClock)mainInput.value=lastExerciseClock}
      function preserveAdminSession(event){const button=event.target.closest('button');if(!button||button.textContent.trim()!=='Ver aluno')return;try{const current=JSON.parse(sessionStorage.getItem('mayfit_user'));if(current?.role==='admin')sessionStorage.setItem('mayfit_admin_return',JSON.stringify(current))}catch{}}
      document.addEventListener('click',preserveAdminSession,true);
      applyTheme(localStorage.getItem('mayfit_theme')||'dark');
      const observer=new MutationObserver(()=>{installPauseControl();separatePauseCountdown()});observer.observe(document.documentElement,{childList:true,subtree:true});setInterval(separatePauseCountdown,1000);installPauseControl();separatePauseCountdown();
    </script>
  </body>
</html>
