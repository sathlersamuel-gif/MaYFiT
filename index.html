<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/figures.css?v=202607302305" />
    <link rel="stylesheet" href="./src/theme.css?v=202607302305" />
    <link rel="stylesheet" href="./src/mobile-audit.css?v=202607302305" />
    <title>MaYFiT</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#050706}
      #boot-status{position:fixed;inset:0;display:grid;place-items:center;background:#050706;color:#fff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;text-align:center;padding:24px}
      #boot-status strong{display:block;color:#8df20b;font-size:30px;margin-bottom:10px}
      #boot-status small{color:#b9c8be}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-status"><div><strong>MaYFiT</strong><small>Carregando…</small></div></div>
    <script>
      const root=document.getElementById('root');
      const boot=document.getElementById('boot-status');
      const observer=new MutationObserver(()=>{if(root.childElementCount){observer.disconnect();boot.remove();}});
      observer.observe(root,{childList:true});
      window.addEventListener('mayfit-ready',()=>boot?.remove(),{once:true});
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script type="module" src="./src/app-bootstrap.js?v=202607302305"></script>
    <script type="module" src="./src/firebase-auth-bridge.js?v=202607302305"></script>
  </body>
</html>
