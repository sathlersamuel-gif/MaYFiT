    <title>MaYFiT</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#050706}
      #boot-status{position:fixed;inset:0;display:grid;place-items:center;background:#050706;color:#fff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;text-align:center;padding:24px}
      #boot-status strong{display:block;color:#8df20b;font-size:30px;margin-bottom:10px}
      #boot-status small{color:#b9c8be}
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-status"><div><strong>MaYFiT</strong><small>Carregando aplicativo…</small></div></div>
    <script>
      const root=document.getElementById('root');
      const boot=document.getElementById('boot-status');
      const observer=new MutationObserver(()=>{if(root.childElementCount){observer.disconnect();boot.remove();}});
      observer.observe(root,{childList:true});
      setTimeout(()=>{if(!root.childElementCount&&boot){boot.querySelector('small').textContent='Ainda carregando… atualize a página uma vez.'}},12000);
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./src/legacy-workout-recovery.js?v=202607310030"></script>
    <script type="text/babel" data-type="module" data-presets="react" src="./src/main-browser.jsx?v=202607310030"></script>
    <script src="./src/approved-workout-ui.js?v=202607310030"></script>
    <script src="./src/workout-interactions.js?v=202607310030"></script>
    <script type="module" src="./src/firebase-auth-bridge.js?v=202607310030"></script>
    <script>
      if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const registrations=await navigator.serviceWorker.getRegistrations();for(const registration of registrations)await registration.unregister();const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}catch{}})}
    </script>
  </body>
