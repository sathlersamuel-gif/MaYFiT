<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06100b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaYFiT" />
    <meta name="description" content="Treinos, evolução corporal e gestão de alunos." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/figures.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <title>MaYFiT</title>
    <style>
      #mayfit-role-switch {
        position: fixed;
        right: 14px;
        bottom: calc(88px + env(safe-area-inset-bottom));
        z-index: 9999;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        background: #7ed832;
        color: #07120d;
        font: 800 14px system-ui, -apple-system, sans-serif;
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
      }
    </style>
    <script>
      (function () {
        const savedTheme = localStorage.getItem('mayfit_theme') || 'dark';
        if (savedTheme === 'light') document.documentElement.classList.add('pre-theme-light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }

      function applyTheme(theme) {
        const light = theme === 'light';
        document.body.classList.toggle('theme-light', light);
        document.documentElement.classList.remove('pre-theme-light');
        localStorage.setItem('mayfit_theme', light ? 'light' : 'dark');
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', light ? '#edf4ef' : '#06100b');
        const button = document.getElementById('mayfit-theme-toggle');
        if (button) {
          button.innerHTML = light ? '<span>🌙</span>Tema escuro' : '<span>☀️</span>Tema claro';
          button.setAttribute('aria-label', light ? 'Ativar tema escuro' : 'Ativar tema claro');
        }
      }

      function installThemeToggle() {
        const old = document.getElementById('mayfit-theme-toggle');
        if (old) old.remove();
        const button = document.createElement('button');
        button.id = 'mayfit-theme-toggle';
        button.type = 'button';
        button.addEventListener('click', () => {
          applyTheme(document.body.classList.contains('theme-light') ? 'dark' : 'light');
        });
        document.body.appendChild(button);
        applyTheme(localStorage.getItem('mayfit_theme') || 'dark');
      }

      function installRoleSwitch() {
        let current = null;
        try { current = JSON.parse(sessionStorage.getItem('mayfit_user')); } catch {}
        if (!current) return;

        const old = document.getElementById('mayfit-role-switch');
        if (old) old.remove();

        const button = document.createElement('button');
        button.id = 'mayfit-role-switch';
        button.type = 'button';

        if (current.role === 'admin') {
          button.textContent = 'Ver como aluno';
          button.addEventListener('click', () => {
            sessionStorage.setItem('mayfit_user', JSON.stringify({
              id: 'aluno',
              name: 'Aluno Teste',
              email: 'aluno@mayfit.com',
              password: '123456',
              role: 'student',
              status: 'active',
              phone: '(69) 99999-0000'
            }));
            location.reload();
          });
        } else {
          button.textContent = 'Voltar ao gerenciamento';
          button.addEventListener('click', () => {
            sessionStorage.setItem('mayfit_user', JSON.stringify({
              id: 'admin',
              name: 'Samuel',
              email: 'admin@mayfit.com',
              password: '123456',
              role: 'admin',
              status: 'active',
              phone: '(69) 98481-0587'
            }));
            location.reload();
          });
        }

        document.body.appendChild(button);
      }

      applyTheme(localStorage.getItem('mayfit_theme') || 'dark');
      window.addEventListener('load', () => {
        installThemeToggle();
        installRoleSwitch();
        setTimeout(() => {
          installThemeToggle();
          installRoleSwitch();
        }, 600);
      });
    </script>
  </body>
</html>
