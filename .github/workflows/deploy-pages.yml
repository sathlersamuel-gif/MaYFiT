name: Publicar MaYFiT no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar versão de produção
        run: npm run build

      - name: Ajustar caminhos e PWA para GitHub Pages
        run: |
          cp sw.js dist/sw.js
          python3 - <<'PY'
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          replacements = {
              'href="/manifest.webmanifest"': 'href="/MaYFiT/manifest.webmanifest"',
              'href="/icons/': 'href="/MaYFiT/icons/',
              "register('/sw.js?v=49')": "register('/MaYFiT/sw.js?v=50', { scope: '/MaYFiT/' })",
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          index.write_text(html, encoding='utf-8')

          manifest = Path('dist/manifest.webmanifest')
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              text = text.replace('"start_url": "/"', '"start_url": "/MaYFiT/"')
              text = text.replace('"scope": "/"', '"scope": "/MaYFiT/"')
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
