name: Gerar APK Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Testar o MayFit
        run: npm test

      - name: Atualizar o aplicativo Android
        run: npm run android:sync

      - name: Gerar APK instalável
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo para download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MaYFiT-Android.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MaYFiT-Android-APK
          path: MaYFiT-Android.apk
          if-no-files-found: error
          retention-days: 30
